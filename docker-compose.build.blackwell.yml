# Docker Compose for building Scriberr with Blackwell GPU support locally
# Uses Dockerfile.cuda.12.9 for RTX 50-series (Blackwell architecture, sm_120)
# For legacy GPUs (GTX 10-series through RTX 40-series), use docker-compose.build.cuda.yml instead
services:
  scriberr:
    build:
      context: .
      dockerfile: Dockerfile.cuda.12.9
    image: scriberr:local-blackwell
    container_name: scriberr
    ports:
      - "8080:8080"
    networks:
      - caddy-proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PUID=${PUID:-10001}
      - PGID=${PGID:-10001}
      - APP_ENV=production
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - scriberr_scriberr_data:/app/data
      - scriberr_scriberr_models:/app/whisperx-env
      - scriberr_model_cache:/home/appuser/.cache
    restart: unless-stopped

networks:
  caddy-proxy:
    external: true

volumes:
  scriberr_scriberr_data:
    external: true
  scriberr_model_cache:
    external: true
  scriberr_scriberr_models:
    external: true
